name: Rust CI

on:
  push:
    branches:
      - main
      - roheet
      - sanjana
      - aritrash

  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all

      - name: Build
        run: cargo check